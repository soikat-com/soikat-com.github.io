<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Shahriar Soikat | Extreme IQ Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;500;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background: #050505; color: white; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .iq-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .iq-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0, 242, 254, 0.1); }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-between">

    <nav class="p-6 flex justify-between items-center max-w-6xl mx-auto w-full animate__animated animate__fadeInDown">
        <h1 class="text-xl md:text-2xl font-black tracking-tight uppercase">Al Shahriar Soikat<span class="text-blue-500">.</span></h1>
        <div class="glass px-4 py-2 rounded-full text-sm">🧠 Pro IQ Lab v2.0</div>
    </nav>

    <div id="main-container" class="max-w-4xl w-full glass rounded-[40px] p-8 md:p-16 shadow-2xl relative overflow-hidden animate__animated animate__zoomIn mx-auto my-10 flex-grow text-center border border-white/5">
        
        <header id="header-section" class="mb-12">
            <h1 class="text-4xl md:text-6xl font-black mb-6 leading-tight">আপনার <span class="gradient-text">IQ</span> লেভেল কত?</h1>
            <p class="text-gray-400 text-lg italic">আমাদের এলগরিদম আপনার উত্তরের ভিত্তিতে নিখুঁত IQ বের করবে।</p>
        </header>

        <div id="age-screen" class="grid grid-cols-1 md:grid-cols-3 gap-6 animate__animated animate__fadeInUp">
            <button onclick="initTest('kids')" class="iq-card glass p-8 rounded-3xl flex flex-col items-center">
                <div class="text-6xl mb-6">🐣</div>
                <h3 class="text-2xl font-bold mb-3">5 - 12 Years</h3>
            </button>
            <button onclick="initTest('teens')" class="iq-card glass p-8 rounded-3xl border-blue-500/30 bg-blue-500/5 flex flex-col items-center">
                <div class="text-6xl mb-6">🚀</div>
                <h3 class="text-2xl font-bold mb-3">13 - 19 Years</h3>
            </button>
            <button onclick="initTest('adults')" class="iq-card glass p-8 rounded-3xl flex flex-col items-center">
                <div class="text-6xl mb-6">🧠</div>
                <h3 class="text-2xl font-bold mb-3">20+ Years</h3>
            </button>
        </div>

        <div id="quiz-screen" class="hidden animate__animated animate__fadeIn">
            <div class="flex justify-between items-center mb-10 pb-4 border-b border-white/5 text-left text-sm md:text-lg">
                <span id="q-count" class="text-blue-400 font-bold">Question 1/10</span>
                <div class="w-40 h-3 bg-white/10 rounded-full"><div id="progress" class="h-full bg-blue-500 rounded-full transition-all" style="width: 10%"></div></div>
            </div>
            <h2 id="question" class="text-2xl md:text-3xl font-bold mb-12 leading-relaxed h-24">...</h2>
            <div id="options" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
        </div>

        <div id="result-screen" class="hidden animate__animated animate__bounceIn">
            <div class="text-7xl mb-6 animate__animated animate__pulse animate__infinite">🎯</div>
            <h2 class="text-3xl font-bold text-gray-400 mb-2">Estimated IQ Score:</h2>
            <h1 class="text-8xl font-black mb-6 gradient-text" id="iq-val">0</h1>
            <p id="iq-msg" class="text-xl text-gray-300 mb-10 italic">নিখুঁত বিশ্লেষণের পর আপনার স্কোর পাওয়া গেছে।</p>
            <button onclick="retryTest()" class="bg-blue-600 px-12 py-5 rounded-full font-bold text-lg hover:bg-blue-700 transition-all iq-card shadow-lg shadow-blue-500/20">আবার চেষ্টা করুন (নতুন প্রশ্ন)</button>
        </div>
    </div>

    <footer class="text-center py-10 text-gray-500 text-sm">
        <p>© 2026 আল শাহরিয়ার সৈকত। সর্বস্বত্ব সংরক্ষিত।</p>
    </footer>

    <script>
        // এখানে আমি নমুনা হিসেবে কিছু প্রশ্ন দিচ্ছি। আপনি এই লিস্টে আরও প্রশ্ন যোগ করতে পারবেন।
        const masterDatabase = {
            kids: [
                { q: "2, 4, 6, 8... Next?", a: ["10", "12", "9"], c: 0 },
                { q: "Sun rises in the?", a: ["West", "North", "East"], c: 2 },
                { q: "Cow has how many legs?", a: ["2", "4", "6"], c: 1 },
                { q: "10 - 5 = ?", a: ["2", "5", "1"], c: 1 },
                { q: "Water freezes into?", a: ["Vapor", "Ice", "Dust"], c: 1 },
                // ... এখানে আরও ৪০টি প্রশ্ন যোগ করুন
            ],
            teens: [
                { q: "1=5, 2=25, 3=125, 4=625, then 5=?", a: ["3125", "1", "625"], c: 1 },
                { q: "What travels around the world but stays in a corner?", a: ["Cloud", "Air", "Stamp"], c: 2 },
                { q: "10 people handshakes once, total?", a: ["45", "50", "90"], c: 0 },
                { q: "If today is Monday, 61 days later?", a: ["Saturday", "Sunday", "Friday"], c: 0 },
                { q: "Avg of 10, 20, 30 is?", a: ["20", "25", "15"], c: 0 },
                // ... এখানে আরও ৪০টি প্রশ্ন যোগ করুন
            ],
            adults: [
                { q: "2, 6, 12, 20, 30... Next?", a: ["42", "40", "50"], c: 0 },
                { q: "Divide 30 by 0.5 and add 10?", a: ["25", "70", "40"], c: 1 },
                { q: "Which word is spelled wrongly in every dictionary?", a: ["Wrongly", "Logic", "Dictionary"], c: 0 },
                { q: "If 1=10, 2=20, then 10=?", a: ["100", "1", "10"], c: 1 },
                { q: "Father of Son is Son of my Father. Who am I?", a: ["Brother", "Father", "Grandpa"], c: 1 },
                // ... এখানে আরও ৪০টি প্রশ্ন যোগ করুন
            ]
        };

        // এই ফাংশনটি ডাটাবেজ থেকে র্যান্ডম ১০টি প্রশ্ন বেছে নেবে
        function getRandomQuestions(cat) {
            let shuffled = masterDatabase[cat].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, 10);
        }

        let qIdx = 0, score = 0, currentQuestions = [], activeCat = "";

        function initTest(cat) {
            activeCat = cat;
            currentQuestions = getRandomQuestions(cat);
            qIdx = 0; score = 0;
            document.getElementById('header-section').classList.add('hidden');
            document.getElementById('age-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            loadQ();
        }

        function loadQ() {
            if (qIdx < 10) {
                const q = currentQuestions[qIdx];
                document.getElementById('question').innerText = q.q;
                document.getElementById('q-count').innerText = `Question ${qIdx + 1}/10`;
                document.getElementById('progress').style.width = ((qIdx + 1) * 10) + '%';
                const div = document.getElementById('options'); div.innerHTML = '';
                q.a.forEach((opt, i) => {
                    const b = document.createElement('button');
                    b.className = "glass p-6 rounded-2xl text-left hover:bg-blue-500/20 border border-white/5 iq-card animate__animated animate__fadeInUp";
                    b.innerText = opt;
                    b.onclick = () => { if(i===q.c) score++; qIdx++; loadQ(); };
                    div.appendChild(b);
                });
            } else showResult();
        }

        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            // নিখুঁত আইকিউ ক্যালকুলেশন লজিক (Bell Curve Basis)
            // ১০/১০ হলে ১৪০+ (জিনিয়াস)
            const iq = 75 + (score * 7); 
            document.getElementById('iq-val').innerText = iq;

            let msg = iq >= 130 ? "জিনিয়াস লেভেল!" : iq >= 110 ? "উন্নত বুদ্ধি!" : iq >= 90 ? "স্বাভাবিক বুদ্ধি" : "অনুশীলন প্রয়োজন";
            document.getElementById('iq-msg').innerText = msg;
        }

        function retryTest() {
            // আবার চেষ্টা করুন চাপলে সরাসরি নতুন ১০টি প্রশ্ন নিয়ে কুইজ শুরু হবে
            initTest(activeCat);
        }
    </script>
</body>
</html>
