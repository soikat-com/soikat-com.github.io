<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মডার্ন আইকিউ চ্যালেঞ্জ | ২০২৬</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;500;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background: #050505; color: white; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .iq-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .iq-card:hover { transform: translateY(-10px) scale(1.02); box-shadow: 0 20px 40px rgba(0, 242, 254, 0.15); }
        .bg-blob { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(79, 172, 254, 0.1) 0%, transparent 70%); z-index: -1; filter: blur(60px); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-blob top-0 left-0"></div>
    <div class="bg-blob bottom-0 right-0"></div>

    <div id="main-container" class="max-w-4xl w-full glass rounded-[40px] p-8 md:p-16 shadow-2xl relative overflow-hidden animate__animated animate__zoomIn">
        
        <header class="text-center mb-12">
            <div class="inline-block px-4 py-1 rounded-full bg-blue-500/10 text-blue-400 text-sm font-bold mb-4 tracking-widest animate__animated animate__fadeInDown">
                FUTURE GEN AI
            </div>
            <h1 class="text-4xl md:text-6xl font-black mb-6 leading-tight">
                আপনার <span class="gradient-text">বুদ্ধিবৃত্তি</span> পরীক্ষা করুন
            </h1>
            <p class="text-gray-400 text-lg">আপনার বয়স অনুযায়ী প্রশ্ন সেট করা হবে। শুরু করতে আপনার বয়স বিভাগ নির্বাচন করুন।</p>
        </header>

        <div id="age-screen" class="grid grid-cols-1 md:grid-cols-3 gap-6 animate__animated animate__fadeInUp">
            <button onclick="startTest('kids')" class="iq-card glass p-8 rounded-3xl text-center hover:bg-white/5">
                <div class="text-5xl mb-4">🐣</div>
                <h3 class="text-xl font-bold mb-2">৫ - ১২ বছর</h3>
                <p class="text-xs text-gray-500">সহজ ও মজার ধাঁধা</p>
            </button>
            <button onclick="startTest('teens')" class="iq-card glass p-8 rounded-3xl text-center border-blue-500/30 bg-blue-500/5">
                <div class="text-5xl mb-4">🚀</div>
                <h3 class="text-xl font-bold mb-2">১৩ - ১৯ বছর</h3>
                <p class="text-xs text-gray-500">যৌক্তিক বিশ্লেষণ</p>
            </button>
            <button onclick="startTest('adults')" class="iq-card glass p-8 rounded-3xl text-center hover:bg-white/5">
                <div class="text-5xl mb-4">🧠</div>
                <h3 class="text-xl font-bold mb-2">২০+ বছর</h3>
                <p class="text-xs text-gray-500">জটিল গাণিতিক ও প্যাটার্ন</p>
            </button>
        </div>

        <div id="quiz-screen" class="hidden animate__animated animate__fadeIn">
            <div class="flex justify-between items-center mb-8">
                <span id="q-count" class="text-blue-400 font-bold">প্রশ্ন ১/৫</span>
                <div class="w-32 h-2 bg-white/10 rounded-full">
                    <div id="progress" class="h-full bg-blue-500 rounded-full transition-all duration-500" style="width: 20%"></div>
                </div>
            </div>
            <h2 id="question" class="text-2xl md:text-3xl font-bold mb-10 leading-relaxed text-center">...</h2>
            <div id="options" class="grid grid-cols-1 gap-4">
                </div>
        </div>

        <div id="result-screen" class="hidden text-center animate__animated animate__bounceIn">
            <div class="text-7xl mb-6">🏆</div>
            <h2 class="text-4xl font-black mb-4">আপনার স্কোর: <span id="score-val" class="gradient-text">০</span></h2>
            <p id="iq-msg" class="text-gray-400 mb-8 text-xl italic">চমৎকার বুদ্ধিমত্তা!</p>
            <button onclick="location.reload()" class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-4 rounded-full font-bold transition-all shadow-lg shadow-blue-500/20">আবার চেষ্টা করুন</button>
        </div>

    </div>

    <script>
        const questionsData = {
            kids: [
                { q: "একটি লাল বল এবং একটি নীল বলের মধ্যে কোনটি ভারী যদি লালটি বড় হয়?", a: ["লাল বল", "নীল বল", "বলা সম্ভব নয়"], c: 2 },
                { q: "২, ৪, ৬, ... পরের সংখ্যাটি কত?", a: ["৭", "৮", "১০"], c: 1 }
            ],
            teens: [
                { q: "একটি ব্যাটারি ও একটি বাল্বের দাম ১১০ টাকা। ব্যাটারির দাম বাল্বের চেয়ে ১০০ টাকা বেশি হলে, বাল্বের দাম কত?", a: ["১০ টাকা", "৫ টাকা", "১৫ টাকা"], c: 1 },
                { q: "যদি ১=৫, ২=২৫, ৩=১২৫ হয়, তবে ৫= কত?", a: ["৬২৫", "১", "৩১২৫"], c: 1 }
            ],
            adults: [
                { q: "কোনটি আলাদা? (কুকুর, বিড়াল, সিংহ, তিমী)", a: ["বিড়াল", "তিমী", "সিংহ"], c: 1 },
                { q: "৩, ৭, ১৫, ৩১, ... পরের সংখ্যাটি কত?", a: ["৬২", "৬৩", "৬৪"], c: 1 }
            ]
        };

        let currentCategory = [];
        let qIndex = 0;
        let score = 0;

        function startTest(cat) {
            currentCategory = questionsData[cat];
            document.getElementById('age-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            if (qIndex < currentCategory.length) {
                const q = currentCategory[qIndex];
                document.getElementById('question').innerText = q.q;
                document.getElementById('q-count').innerText = `প্রশ্ন ${qIndex + 1}/${currentCategory.length}`;
                document.getElementById('progress').style.width = ((qIndex + 1) / currentCategory.length * 100) + '%';
                
                const optionsDiv = document.getElementById('options');
                optionsDiv.innerHTML = '';
                q.a.forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.className = "glass p-5 rounded-2xl text-left hover:bg-blue-500/20 transition-all border border-white/5 hover:border-blue-400/50 iq-card animate__animated animate__fadeInRight";
                    btn.style.animationDelay = `${i * 0.1}s`;
                    btn.innerText = opt;
                    btn.onclick = () => checkAnswer(i);
                    optionsDiv.appendChild(btn);
                });
            } else {
                showResult();
            }
        }

        function checkAnswer(i) {
            if (i === currentCategory[qIndex].c) score++;
            qIndex++;
            loadQuestion();
        }

        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            const finalScore = Math.round((score / currentCategory.length) * 100);
            document.getElementById('score-val').innerText = finalScore + '%';
            
            if (finalScore > 70) document.getElementById('iq-msg').innerText = "আপনি একজন জিনিয়াস!";
            else if (finalScore > 40) document.getElementById('iq-msg').innerText = "আপনার বুদ্ধিমত্তা বেশ ভালো।";
            else document.getElementById('iq-msg').innerText = "আরও অনুশীলনের প্রয়োজন।";
        }
    </script>
</body>
</html>
